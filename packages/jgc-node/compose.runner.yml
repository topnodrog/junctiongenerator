services:
  runner:
    build: .
    environment:
      JGC_SEEDS: "${JGC_SEEDS:?set JGC_SEEDS to comma-separated wss:// seed URLs}"
      JGC_PARTICIPATE: "${JGC_PARTICIPATE:-false}"
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - runner-data:/data
    restart: unless-stopped

volumes:
  runner-data:
