name: Reproducible build challenge
description: Report a pinned source check or compare a published release. Mismatches and incomplete builds are useful.
title: "[Rebuild] "
labels: ["rebuild-attestation"]
body:
  - type: markdown
    attributes:
      value: |
        Run the [pinned source challenge](https://junctiongenerator.net/review) or reproduce a published `jgc-node` release. Record the exact commit and the result below. A **mismatch is a finding**, not a failure. A source check without a matching published reference is a starting contribution, not an independent release match. Setup and full checks may take longer than ten minutes.

        ```text
        cd packages/jgc-node
        npm ci
        npm run typecheck
        npm run build
        npm run release:check
        npm run gates:status
        ```

        See the [review pack](https://github.com/topnodrog/junctiongenerator/blob/main/docs/mainnet/REVIEW_PACK.md) and the [release manifest docs](https://github.com/topnodrog/junctiongenerator/blob/main/packages/jgc-node/README.md).
  - type: input
    id: commit
    attributes:
      label: Release commit or tag
      placeholder: "jgc-node-v0.1.0 / full 40-character commit"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, architecture and Node version
      placeholder: "Ubuntu 24.04 / x86_64 / Node 22.22.3"
    validations:
      required: true
  - type: input
    id: tree-digest
    attributes:
      label: RELEASE-MANIFEST.json treeSha256
      description: "Include this for a completed bundle check; leave blank if the build failed before the manifest was produced."
    validations:
      required: false
  - type: input
    id: archive-digest
    attributes:
      label: Release archive SHA-256 (when available)
      description: "Leave blank if no reference archive exists for your pinned commit. This records a source check, not a matching release attestation."
    validations:
      required: false
  - type: dropdown
    id: matched
    attributes:
      label: What result are you reporting?
      options:
        - "Yes — both matched"
        - "No — one or both differ (finding)"
        - "Source checks completed; no matching reference archive is published"
        - "I could not complete the build"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / mismatch details
      description: "For a mismatch or incomplete build, include the first failing command and relevant output. Remove secrets and personal file paths."
