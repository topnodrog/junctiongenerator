name: JGC node consensus

on:
  push:
    paths:
      - "packages/jgc-node/**"
      - "packages/jg-codegen/**"
      - ".github/workflows/jgc-node-ci.yml"
      - ".github/workflows/jgc-node-release.yml"
  pull_request:
    paths:
      - "packages/jgc-node/**"
      - "packages/jg-codegen/**"
      - ".github/workflows/jgc-node-ci.yml"
      - ".github/workflows/jgc-node-release.yml"

permissions:
  contents: read

jobs:
  hosted-monitor:
    name: Hosted monitor container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/jgc-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node deploy/monitor/stage.mjs .tmp/monitor-ci
      - name: Build and start the isolated monitor image
        run: |
          docker build -f .tmp/monitor-ci/deploy/monitor/Dockerfile -t jgc-monitor-ci .tmp/monitor-ci
          docker run -d --name jgc-monitor-ci -p 18080:8080 -e GOOGLE_CLOUD_PROJECT=ci-project -e MONITOR_BUCKET=ci-bucket -e MONITOR_WINDOW_ID=ci-window -e MONITOR_DEADLINE_UTC=2030-01-01T00:00:00Z -e MONITOR_SCHEDULER_JOB=projects/ci-project/locations/us-central1/jobs/ci-window jgc-monitor-ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:18080/health; then exit 0; fi
            sleep 1
          done
          docker logs jgc-monitor-ci
          exit 1
      - name: Stop monitor container
        if: always()
        run: docker rm -f jgc-monitor-ci || true

  codegen:
    name: Deterministic code generator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/jg-codegen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/jg-codegen/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  node-consensus:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20]
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/jgc-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/jgc-node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build
      - name: Gemini monitor review boundaries
        run: node --test deploy/monitor/review.test.mjs
      - name: Consensus and genesis vectors
        run: npm test -- --ci --runTestsByPath src/tests/canonical.test.ts src/tests/network-identity.test.ts

  runner-release-bundle:
    name: Runner release bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/jgc-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/jgc-node/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Confirm mainnet preflight remains fail-closed
        shell: bash
        run: |
          set +e
          node dist/scripts/mainnet-preflight.js > mainnet-preflight.json
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Mainnet preflight unexpectedly reported ready" >&2
            exit 1
          fi
          node -e 'const fs=require("fs"); const result=JSON.parse(fs.readFileSync("mainnet-preflight.json", "utf8")); const required=["proofSystem","deterministicConsensus","permissionlessProduction","peerAuthentication","validatorEconomics","reproducibleArtifacts","soloSoak","independentSecurityReview"]; if (result.ready || result.status !== "blocked" || JSON.stringify(result.missingGates) !== JSON.stringify(required)) process.exit(1);'
      - name: Stage the allowlisted release contents
        env:
          JGC_RELEASE_COMMIT: ${{ github.sha }}
        run: npm run release:stage
      - name: Confirm local state and credentials are excluded
        shell: bash
        run: |
          bundle=".tmp/release/jgc-node-v$(node -p 'require("./package.json").version')"
          test -f "${bundle}/RELEASE-MANIFEST.json"
          test -f "${bundle}/dist/scripts/testnet-node.js"
          test ! -e "${bundle}/data"
          test ! -e "${bundle}/node_modules"
          if find "${bundle}" -type f \( -name "*.keystore.json" -o -name ".env*" \) | grep -q .; then
            echo "Release bundle contains forbidden local state" >&2
            exit 1
          fi
      - name: Verify deterministic release manifest
        run: npm run release:verify
      - name: Verify release manifest unit tests
        run: npm run test:release-manifest
      - name: Run the operator rehearsal from the staged bundle
        shell: bash
        run: |
          bundle=".tmp/release/jgc-node-v$(node -p 'require("./package.json").version')"
          cd "${bundle}"
          npm ci
          npm run release:check

  rust-verifier:
    name: Rust/WASM verifier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/jgc-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo test --locked --manifest-path rust/Cargo.toml
      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - run: wasm-pack build rust --target nodejs --out-dir pkg --release

  docker-compose-smoke:
    name: Docker Compose testnet smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/jgc-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Build and launch the smoke testnet
        run: docker compose -f compose.testnet.yml -f compose.smoke.yml up -d --build
      - name: Verify block production and two-node synchronization
        run: node scripts/compose-smoke.mjs
      - name: Show container diagnostics
        if: failure()
        run: docker compose -f compose.testnet.yml -f compose.smoke.yml logs --no-color
      - name: Stop the smoke testnet
        if: always()
        run: docker compose -f compose.testnet.yml -f compose.smoke.yml down -v
