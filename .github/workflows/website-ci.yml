name: Website and Worker

on:
  push:
    paths:
      - "src/**"
      - "public/**"
      - "api/**"
      - "contracts/JGTClaimDispenser.sol"
      - "scripts/relayer/**"
      - "scripts/deploy/**"
      - "scripts/test/**"
      - "tools/jgt-rescue/**"
      - "package.json"
      - "yarn.lock"
      - "next.config.ts"
      - "eslint.config.mjs"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - ".github/workflows/website-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "api/**"
      - "contracts/JGTClaimDispenser.sol"
      - "scripts/relayer/**"
      - "scripts/deploy/**"
      - "scripts/test/**"
      - "tools/jgt-rescue/**"
      - "package.json"
      - "yarn.lock"
      - "next.config.ts"
      - "eslint.config.mjs"
      - "tsconfig.json"
      - "postcss.config.mjs"
      - ".github/workflows/website-ci.yml"

permissions:
  contents: read

jobs:
  website:
    name: Website lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build

  worker-api:
    name: Worker JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Check Worker and migration scripts
        shell: bash
        run: |
          for file in api/*.js api/*.mjs scripts/deploy/*.js scripts/deploy/*.cjs tools/jgt-rescue/*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Test Worker and deployment safety
        run: >-
          node --test api/public-write.test.mjs api/legacy-rewards.test.mjs
          api/rate-limit.test.mjs scripts/deploy/deployment-safety.test.cjs
      - name: Check JGT relayer script syntax
        run: node --check scripts/relayer/submit_jgt_claim.mjs

  jgt-faucet-contract:
    name: Compile JGT faucet contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
      - name: Install pinned Solidity compiler
        run: npm ci --prefix tools/jgt-rescue
      - name: Compile faucet
        run: node scripts/test/compile_jgt_faucet.cjs
