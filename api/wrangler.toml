account_id = "14e1784eca55fb28383172384ac8990c"
name = "jgt-mining-api"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# Turso database URL
TURSO_URL = "https://jgt-mining-topnodrog.aws-us-east-2.turso.io"
# Recipient for the daily new-signups digest email
DIGEST_RECIPIENT = "jgordon5240@gmail.com"
# Legacy record value only; the Worker does not submit on-chain JGT payouts.
AD_REWARD_JGT = "1"
# Siteverify must confirm both the expected hostname and the form action.
TURNSTILE_HOSTNAMES = "junctiongenerator.net,www.junctiongenerator.net"
# Secrets (set via wrangler secret put):
# TURSO_AUTH_TOKEN - Turso auth token
# TURNSTILE_SECRET_KEY - widget secret; never store in source or local files
# API_SECRET - Bearer token gating the owner endpoints (ad-view,
#              referral/claim, campaigns POST, pending-rewards)
# CRON_SECRET - Bearer token gating automation endpoints (dispense, digest/run)

# Structured logs in the Cloudflare dashboard (Workers Logs)
[observability]
enabled = true

# Per-IP rate limiting for the active public write endpoints (subscribe,
# hire-lead, community join, community activation). A missing binding is allowed
# only on loopback local development; production requests fail closed.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Cron trigger — runs daily at midnight UTC
[triggers]
crons = ["0 0 * * *"]

# Lets the worker send immediate lead/signup notifications and the midnight
# digest fallback. The destination address is verified in Cloudflare Email
# Routing; the live binding was end-to-end tested on 2026-07-24.
[[send_email]]
name = "EMAIL_SENDER"
destination_address = "jgordon5240@gmail.com"
